<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Dashboard - AI College Problem Radar</title><link rel="stylesheet" href="style.css"></head><body><header class="topbar"><div class="brand"><span class="logo">⌁</span><div><b>AI College</b><span>Problem Radar • Admin</span></div></div><a class="btn small" href="index.html">Back to Website</a></header><main class="section"><div class="section-head"><span>ADMINISTRATION</span><h2>Complaint Dashboard</h2><p>Demo dashboard using browser local storage.</p></div><div id="adminStats" class="cards"></div><div style="overflow:auto;margin-top:25px"><table id="complaintTable" style="width:100%;border-collapse:collapse;background:white"><thead><tr><th>ID</th><th>Title</th><th>Category</th><th>Priority</th><th>Status</th><th>Department</th></tr></thead><tbody></tbody></table></div></main><script>const all=JSON.parse(localStorage.getItem('collegeRadarComplaints')||'[]');const count=(p)=>all.filter(x=>x.priority===p).length;document.getElementById('adminStats').innerHTML=`<article><h3>Total Complaints</h3><p>${all.length}</p></article><article><h3>Critical</h3><p>${count('Critical')}</p></article><article><h3>High</h3><p>${count('High')}</p></article>`;document.querySelector('#complaintTable tbody').innerHTML=all.map(x=>`<tr><td>${x.id}</td><td>${x.title}</td><td>${x.category}</td><td>${x.priority}</td><td>${x.status}</td><td>${x.dept}</td></tr>`).join('')||'<tr><td colspan="6" style="padding:20px;text-align:center">No complaints yet.</td></tr>';document.querySelectorAll('#complaintTable th,#complaintTable td').forEach(x=>x.style.padding='12px');document.querySelectorAll('#complaintTable th').forEach(x=>x.style.background='#eaf2f8');</script></body></html>
